[package]
name = "oxelot-sqlite-vfs"
version = "0.1.0"
edition = "2021"
description = "SQLite compiled for wasm32 with an OPFS VFS backend, exposed via wasm-bindgen"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
