[package]
name = "oxelot-sqlite-vfs"
version = "0.1.0"
edition = "2021"
description = "SQLite compiled for wasm32-wasip1, persisted to OPFS via serialize/deserialize, exposed over a plain extern-C ABI"
license = "MIT"

[lib]
path = "sqlite-vfs/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
