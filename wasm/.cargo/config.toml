[env]
# Zig is the C compiler for the wasm32-wasip1 target (clang is not installed on
# dev machines or CI). `npm run build:wasm` sets CC_wasm32_wasip1 to the
# portable wrapper at scripts/zigcc (which locates zig via $ZIG). Keep the
# cargo-level default here pointing at the wrapper too, so direct `cargo build
# --target wasm32-wasip1` works out of the box.
CC_wasm32_wasip1 = { value = "../scripts/zigcc", relative = true, force = true }

# Note: libsqlite3-sys 0.38+ detects `wasm32-wasi*` targets itself and applies
# the wasm-specific C flags (SQLITE_THREADSAFE=0, LONGDOUBLE_TYPE=double, the
# _WASI_EMULATED_* macros). Do NOT set LIBSQLITE3_FLAGS here: it would also
# apply to host builds and strip the host SQLite's mutex support.
